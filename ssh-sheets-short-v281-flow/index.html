<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10"><title>Step Deck: Short script v2.8.1 (flow tracker)</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#151a21;--hi:#1d2c44;--acc:#4ea1ff;--click:#ffcc33;--mut:#8b97a7;--fg:#eef2f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:20px/1.5 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.home{max-width:520px;margin:12vh auto;padding:20px;text-align:center}
.home input{font-size:40px;width:6em;text-align:center;background:var(--card);color:var(--fg);border:2px solid #333;border-radius:14px;padding:10px;letter-spacing:.2em}
.btn{display:block;width:100%;margin:14px 0;padding:18px;font-size:22px;border:0;border-radius:14px;background:var(--acc);color:#000;font-weight:700;text-decoration:none}
.btn.alt{background:#2a3340;color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:#0b0d10;padding:10px 16px;font-size:15px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:space-between;border-bottom:1px solid #222}
#list{padding:12px 12px 140px}
.step{scroll-margin-top:60px;background:var(--card);border-radius:16px;padding:16px;margin:12px 0;border:3px solid transparent;transition:background .15s}
.step.cur{background:var(--hi);border-color:var(--acc)}
.top{display:flex;gap:12px;align-items:baseline}.num{font-size:30px;font-weight:800;color:var(--acc)}.tm{color:var(--mut);font-size:17px}.ttl{font-weight:700}
.do{color:#b9c6d6;font-size:17px;margin:8px 0}.ty{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:17px;background:#000;padding:6px 10px;border-radius:8px;margin:6px 0;color:#9ef0a5;word-break:break-word}
.say{font-size:23px;line-height:1.55;margin:10px 0}.ck{background:var(--click);color:#000;font-weight:800;border-radius:6px;padding:0 5px;white-space:nowrap}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(11,13,16,.96);z-index:6}
.nav button{flex:1;font-size:30px;padding:16px;border-radius:16px;border:0;background:var(--acc);color:#000;font-weight:800}
.nav button.up{background:#2a3340;color:var(--fg)}
#scr{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
#scr .cap{padding:10px 16px;font-size:24px;display:flex;gap:14px;align-items:center;background:#0b0d10}
#scr .cap .num{font-size:34px}#scr .cap .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scr img{flex:1;min-height:0;width:100%;object-fit:contain}#scr{position:relative}#ib{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font:600 13px system-ui,sans-serif;padding:3px 9px;border-radius:12px;display:none;pointer-events:none}
#scr .ctl button{font-size:26px;padding:6px 20px;margin-left:6px;border:0;border-radius:10px;background:#2a3340;color:#fff}
.upd{color:var(--mut);font-size:13px}.home .upd{margin-top:18px;font-size:15px}#scr .updbar{padding:2px 16px 6px;background:#0b0d10;color:var(--mut);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c33;margin-right:6px}.dot.on{background:#3c3}
.nav{flex-wrap:wrap}
.nav .row{display:flex;gap:8px;width:100%}
.nav button{font-size:22px;padding:12px 6px;min-height:58px}
.nav button.nx{flex:2.2;font-size:30px;background:var(--click)}
.nav button.alt{background:#2a3340;color:var(--fg)}
.nav button.sk{background:#4a4f58;color:#fff}.nav button.ad{background:#6b3fa0;color:#fff}.nav button.ad.on{background:#c77dff;color:#000;outline:3px solid #fff}
#list{padding:12px 12px 62vh}
.cnt{margin-left:auto;font-size:14px;color:var(--mut);white-space:nowrap}
.step.cur .cnt{color:#cfe3ff}
.say{position:relative;min-height:56px;padding:12px 14px 12px 16px;border-left:8px solid #2b3442;border-radius:10px;margin:10px 0;color:#c4cdd8;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s,background .15s}
.say .tg::before{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;padding:1px 8px;border-radius:99px;margin-right:8px;vertical-align:middle;line-height:1.5}
.say.read{opacity:.35;border-left-color:#3a4a3a}.say.read .tg::before{content:"\2713 read";background:#2e5a36;color:#cfe}
.say.skip{opacity:.62;color:#8a8f98;border-left:8px dashed #7a7f88;background:rgba(120,124,132,.10)}.say.skip .tg::before{content:"skipped";background:#555;color:#ddd}
.say.now{opacity:1;color:#fff;font-size:27px;font-weight:600;border-left:12px solid var(--click);background:rgba(255,204,51,.10)}
.say.now .tg::before{content:"NOW";background:var(--click);color:#000}
.say.now.adlib{border-left-color:#c77dff;background:rgba(199,125,255,.14)}
.say.now.adlib .tg::before{content:"NOW \00b7 AD-LIB";background:#c77dff;color:#000}
.say .ab{display:none;margin:8px 0 2px;padding:8px 10px;border-radius:8px;background:#c77dff;color:#000;font-size:17px;font-weight:800}
.say.now.adlib .ab{display:block}

/* ---- FLOW variant: one glanceable screen, no page scrolling ---- */
html,body{height:100%;overflow:hidden}
body.flow #app{height:100dvh;display:flex;flex-direction:column}
body.flow header{position:relative;flex:none;padding:8px 14px;font-size:15px}
body.flow #list{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 24px;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
body.flow .nav{position:relative;flex:none}
#strip{flex:none;background:#10141a;border-bottom:2px solid #222;padding:8px 12px;min-height:76px;max-height:34vh;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:6px}
#strip .talk{color:#5d6876;font-size:20px;text-align:center;letter-spacing:.04em}
#strip .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-weight:800;border-radius:10px;white-space:normal;line-height:1.2;color:#000;vertical-align:baseline}
.chip.click{background:#ffcc33}.chip.dbl{background:#ff9f43}.chip.type{background:#4be37a}.chip.key{background:#5ab0ff}.chip.move{background:#6fe0d6}.chip.wait{background:#ff6b6b}.chip.drag{background:#c9a0ff}.chip.pause{background:#444b57;color:#ddd}
.chip.big{font-size:22px;padding:5px 12px}
.chip.big.pause{font-size:17px;padding:5px 10px;align-self:center}
.chip.in{font-size:15px;padding:1px 8px;margin:0 5px;letter-spacing:.01em}
.chip.in.pause{font-size:13px;padding:0 6px}
.chip .no{display:inline-block;background:#000;color:#fff;border-radius:99px;width:1.25em;height:1.25em;line-height:1.25em;text-align:center;font-size:.8em;margin-right:.4em}
#box{font-family:ui-monospace,Menlo,monospace;font-size:21px;line-height:1.35;background:#000;color:#9ef0a5;border:2px solid #2d6a3d;border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;user-select:all}
#after{flex:none;background:#10141a;border-top:1px solid #222;padding:8px 14px;font-size:17px;color:#9aa7b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:40px}
#after b{color:#6f7c8c;letter-spacing:.08em;font-size:13px;margin-right:8px}
#after .chip.in{font-size:14px;margin:0 3px 0 0;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
body.flow .say{font-size:19px;color:#6e7886;opacity:.55;min-height:56px;line-height:1.45;margin:6px 0}
body.flow .say.nx{opacity:1;color:#c4cdd8;font-size:23px}
body.flow .say.read{opacity:.25}
body.flow .say.skip{opacity:.4}
body.flow .say.now{opacity:1;color:#fff;font-size:30px;line-height:1.5;font-weight:600;padding:12px 14px 14px 16px}
/* ---- CUE layer: arrow trail just above the line (compact, wraps, never cut) ---- */
.say .cue{display:flex;flex-wrap:wrap;align-items:center;gap:2px 3px;margin:0 0 6px;font-size:13px;font-weight:800;line-height:1.15;letter-spacing:0}
.say .cp{padding:2px 8px;border-radius:99px;background:#2a4d7c;color:#e3f0ff}
.say .ca{color:#7fa6d6;font-weight:900;font-size:14px}
body.flow .say.now .cue{font-size:16px;margin-bottom:8px}body.flow .say.now .cp{background:#2f6fd0;color:#fff;padding:3px 9px}body.flow .say.now .ca{color:#9cc2ff;font-size:17px}
body.flow .say.nx .cue{font-size:12px;margin-bottom:4px}body.flow .say.nx .cp{background:#243a57;color:#bcd9ff;padding:1px 7px}
#hc .stp{float:right}
body.flow .say.now.long{font-size:33px;line-height:1.6}
body.flow .say.now.epi{font-size:40px;line-height:1.65;padding:16px 18px 20px 20px}
body.flow .say.now.epi .cue{font-size:18px}body.flow .say.now.epi .cp{font-size:17px}
body.flow .say.now.tight{padding:6px 10px 8px 12px;line-height:1.35}body.flow .say.now.tight .cue{font-size:13px;margin-bottom:4px}body.flow .say.now.tight .cp{padding:1px 7px}
#ov{position:fixed;inset:0;z-index:20;background:#0b0d10;display:none;flex-direction:column}
#ov.on{display:flex}
#ov .bar{display:flex;gap:10px;padding:10px;align-items:center;font-size:20px}
#ov .bar span{flex:1}
#ov .bar button{min-height:56px;min-width:56px;border:0;border-radius:14px;background:#2a3340;color:#fff;font-size:24px;padding:0 18px}
#ov .body{flex:1;overflow:auto;padding:0 12px 24px}
#ov details{background:var(--card);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:17px}
#ov summary{min-height:44px;display:flex;align-items:center;font-weight:700}
#ov .it{display:flex;gap:12px;align-items:center;min-height:56px;padding:6px 12px;border-radius:12px;background:var(--card);margin:6px 0;font-size:18px}
#ov .it.cur{background:var(--hi);outline:2px solid var(--acc)}
#ov .it .num{font-size:24px;min-width:2.2em}#ov .it .t{flex:1}#ov .it small{color:var(--mut)}
</style></head><body><div id="app"></div>
<script>
const P=new URLSearchParams(location.search),code=(P.get('s')||'').replace(/\W/g,''),view=P.get('v')||(location.pathname.includes('screen')?'screen':location.pathname.includes('script')?'script':'');
const pic=(s,j)=>s.images?s.images[(s.si&&s.si[j]!=null)?s.si[j]:0]:s.image;
function badge(s,j){const b=document.getElementById('ib');if(!b)return;if(s.images){s.images.forEach(x=>{new Image().src=x+'?'+ver});b.style.display='block';b.textContent=((s.si&&s.si[j]!=null)?s.si[j]:0)+1+'/'+s.images.length}else b.style.display='none'}
const app=document.getElementById('app');let D,cur=1,ver='',S={},ad=false,stamp=0,lastMsg='';
const LS='sst-flow:'+code;document.body.classList.toggle('flow',view==='script');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtSay=s=>esc(s).replace(/\[click now\]/gi,'<span class="ck">[click now]</span>');
if(!code||!view){
  const r=String(1000+Math.floor(Math.random()*9000));
  app.innerHTML=`<div class="home"><h1>Step Deck</h1><p style="color:var(--mut);margin-top:-8px">Short script v2.8.1 (flow tracker)</p><p>Session code</p><input id="c" inputmode="numeric" value="${code||r}">
  <a class="btn" id="a">Open Script view</a><a class="btn alt" id="b">Open Screen view</a><p style="color:var(--mut);font-size:16px">Use the same code on both devices.</p><p class="upd" id="hupd"></p></div>`;
  const go=v=>location.href=`?s=${encodeURIComponent(document.getElementById('c').value.replace(/\W/g,''))}&v=${v}`;
  fetch('steps.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{const h=document.getElementById('hupd');if(h&&j.updated)h.textContent='Last updated: '+j.updated}).catch(()=>{});
  document.getElementById('a').onclick=()=>go('script');document.getElementById('b').onclick=()=>go('screen');
}else start();

/* ---- line tracker state ----
   S[n] = {i: current line index (0-based), m: string, one char per line: '.' not done, 'r' read, 's' skipped}
   ad = ad-lib flag for the current card. Only the user's taps/buttons ever change this.
   Sync message: "n:i:marks:a"  (plain "n" from older pages = card n, first line). */
const K=n=>D.steps[n-1].say.length;
const fresh=n=>({i:0,m:'.'.repeat(K(n))});
const st=()=>S[cur]||(S[cur]=fresh(cur));
const enc=()=>{const s=st();return `${cur}:${s.i}:${s.m}:${ad?1:0}`};
function parse(msg){const p=String(msg).trim().split(':');const n=+p[0];if(!n||!D.steps[n-1])return null;
  const k=K(n);let i=0,m='.'.repeat(k),a=0;
  if(p.length>=3){i=Math.min(k-1,Math.max(0,+p[1]||0));if(/^[.rs]+$/.test(p[2])&&p[2].length===k)m=p[2];a=p[3]==='1'?1:0}
  return {n,s:{i,m},a}}
function save(){try{localStorage.setItem(LS,JSON.stringify({cur,S,ad,t:Date.now()}))}catch(e){}}
function commit(send){save();paint(send&&true);if(send){lastMsg=enc();fetch(window.__T,{method:'POST',body:lastMsg}).catch(()=>{})}}
function setAt(m,i,c){return m.slice(0,i)+c+m.slice(i+1)}
function enterCard(n,send){cur=n;S[n]=fresh(n);ad=false;commit(send)}      // fresh card, first line
function move(d){const n=Math.min(D.steps.length,Math.max(1,cur+d));if(n!==cur)enterCard(n,true)}
function nextLine(){const s=st(),k=K(cur);s.m=setAt(s.m,s.i,'r');ad=false;
  if(s.i>=k-1){if(cur<D.steps.length)enterCard(cur+1,true);else commit(true);return}
  s.i++;s.m=setAt(s.m,s.i,'.');commit(true)}
function prevLine(){const s=st();ad=false;if(s.i<=0){commit(true);return}
  s.m=setAt(s.m,s.i,'.');s.i--;s.m=setAt(s.m,s.i,'.');commit(true)}
function skipLine(){const s=st(),k=K(cur);s.m=setAt(s.m,s.i,'s');ad=false;
  if(s.i>=k-1){if(cur<D.steps.length)enterCard(cur+1,true);else commit(true);return}
  s.i++;s.m=setAt(s.m,s.i,'.');commit(true)}
function adlib(){ad=!ad;commit(true)}
function tapLine(n,j){
  if(n!==cur){cur=n;S[n]=fresh(n);S[n].i=j;ad=false;commit(true);return}   // other card: just start at that line
  const s=st();
  if(j>s.i){s.m=setAt(s.m,s.i,'r');for(let q=s.i+1;q<j;q++)if(s.m[q]==='.')s.m=setAt(s.m,q,'s')}   // went through the old line, jumped over the ones between
  else if(j<s.i){s.m=setAt(s.m,s.i,'.')}
  s.i=j;s.m=setAt(s.m,j,'.');ad=false;commit(true)}
const counts=n=>{const m=(S[n]||fresh(n)).m;const r=(m.match(/r/g)||[]).length,k=(m.match(/s/g)||[]).length;return {r,k,l:m.length-r-k}};
const cntTxt=n=>{const c=counts(n);return `read ${c.r} \u00b7 skipped ${c.k} \u00b7 left ${c.l}`};

let lastScrolled='';
function paint(send){
  if(view==='script'){
    const c=D.steps[cur-1],s=st();
    document.querySelectorAll('#list .say').forEach(l=>l.remove());
    renderLines();
    document.getElementById('pos').textContent=`Step ${c.n} (${cur}/${D.steps.length}) \u00b7 line ${s.i+1}/${K(cur)}`;
    document.getElementById('hc').innerHTML=`${esc(cntTxt(cur))}${D.updated?` <span class="stp">Last updated: ${esc(D.updated)}</span>`:''}`;
    const ab=document.getElementById('ad');if(ab)ab.classList.toggle('on',ad);
    renderStrip();renderAfter();center(send);
  }else{const s=D.steps[cur-1];document.getElementById('sn').textContent=s.n;document.getElementById('st').textContent=s.title+(s.do?' \u2014 '+s.do:'');
    const jj=(st()||{}).i||0,pc=pic(s,jj),im=document.getElementById('im'),src=pc?pc+'?'+ver:'';if(!im.getAttribute('src')||im.getAttribute('src')!==src)im.src=src;badge(s,jj);
    const nx=D.steps[cur];if(nx&&nx.image)new Image().src=nx.image+'?'+ver;}
}
function center(smooth){
  const L=document.getElementById('list'),el=L&&L.querySelector('.say.now');if(!el)return;
  el.style.fontSize='';el.classList.remove('tight');
  if(el.classList.contains('epi')||el.classList.contains('long')){L.scrollTop=el.offsetTop-L.offsetTop-6;return}
  let fs=30;el.style.fontSize='';el.classList.remove('tight');
  while(el.offsetHeight>L.clientHeight-20&&fs>20){fs-=2;el.style.fontSize=fs+'px'}
  if(el.offsetHeight>L.clientHeight-20){el.classList.add('tight');while(el.offsetHeight>L.clientHeight-20&&fs>16){fs-=1;el.style.fontSize=fs+'px'}}
  L.scrollTop=el.offsetTop-L.offsetTop-6;
}
function applyRemote(msg){const p=parse(msg);if(!p)return;cur=p.n;S[p.n]=p.s;ad=!!p.a;lastMsg=enc();save();paint(false)}

async function start(){
  D=await (await fetch('steps.json',{cache:'no-store'})).json();
  try{ver=(await (await fetch('images/.v',{cache:'no-store'})).text()).trim()}catch(e){}
  try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o&&o.S&&D.steps[o.cur-1]){S=o.S;cur=o.cur;ad=!!o.ad;stamp=o.t||0;
    Object.keys(S).forEach(n=>{if(!D.steps[n-1]||S[n].m.length!==K(+n))delete S[n]})}}catch(e){}
  view==='script'?renderScript():renderScreen();paint(false);
  if(view==='script')setTimeout(()=>center(false),80);
  const T='https://ntfy.sh/stepdeck-sst-v281flow-b8n5-'+code;window.__T=T;
  try{const t=await (await fetch(T+'/json?poll=1&since=12h',{cache:'no-store'})).text();const ls=t.trim().split('\n').filter(Boolean).map(JSON.parse).filter(m=>m.event==='message');
    if(ls.length){const m=ls[ls.length-1];if(!stamp||m.time*1000>stamp)applyRemote(m.message)}}catch(e){}
  const es=new EventSource(T+'/sse');
  es.onmessage=e=>{const m=JSON.parse(e.data);if(m.event==='message'&&m.message!==lastMsg)applyRemote(m.message)};es.onopen=()=>dot(1);es.onerror=()=>dot(0);
  document.addEventListener('keydown',e=>{
    if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();nextLine()}
    else if(e.key==='ArrowLeft'){e.preventDefault();prevLine()}
    else if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();move(1)}
    else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();move(-1)}
    else if(e.key==='s'||e.key==='S')skipLine();else if(e.key==='a'||e.key==='A')adlib();});
  let y0=null,x0=null;
  if(view==='screen'){document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY});
    document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)move(dx<0?1:-1)});}
}
function dot(on){const d=document.getElementById('dot');if(d)d.className='dot'+(on?' on':'')}
const KL={click:'\u25b6 CLICK',dbl:'\u25b6\u25b6 DOUBLE-CLICK',type:'\u2328 TYPE',key:'\u2328 KEY',move:'\u2197 MOVE',drag:'\u2193 DRAG',wait:'\u23f3 WAIT',pause:'\u23f8'};
const chipTxt=c=>c.k==='pause'?`${KL.pause} ${c.l}`:`${KL[c.k]}${c.l?' '+c.l:''}`;
const inTxt=c=>c.k==='pause'?`${KL.pause} ${c.l.replace('pause ','')}`:c.k==='key'?`${KL.key} ${c.l}`:KL[c.k].replace(' DOUBLE-CLICK',' DBL-CLICK');
const chipH=(c,cls,no)=>`<span class="chip ${c.k} ${cls}">${no?`<span class="no">${no}</span>`:''}${esc(cls==='big'||cls==='in af'?chipTxt(c):inTxt(c))}</span>`;
const LN=(n,j)=>((D.steps[n-1].lines||[])[j])||{c:[],b:null};
function lineHtml(n,j,withChips){
  const say=D.steps[n-1].say[j],ch=withChips?LN(n,j).c:[];let out='',p=0;
  const act=ch.filter(c=>c.k!=='pause');
  ch.forEach(c=>{out+=fmtSay(say.slice(p,c.o))+chipH(c,'in',c.k!=='pause'&&act.length>1?act.indexOf(c)+1:0);p=c.o});
  return out+fmtSay(say.slice(p));
}
const cueHtml=(n,j)=>{const q=LN(n,j).q;return q?`<div class="cue">${q.split(' > ').map(x=>`<span class="cp">${esc(x)}</span>`).join('<span class="ca">\u203a</span>')}</div>`:''};
function renderLines(){
  const L=document.getElementById('list'),s=st(),c=D.steps[cur-1];
  L.innerHTML=c.say.map((l,j)=>{const mk=s.m[j],now=j===s.i,wc=l.split(/\s+/).length,lg=now&&wc>200?' epi':now&&wc>38?' long':'',cls=now?' now'+lg+(ad?' adlib':''):j===s.i+1?' nx':mk==='r'?' read':mk==='s'?' skip':'';
    return `<div class="say${cls}" data-i="${j}">${now||j===s.i+1?cueHtml(cur,j):''}<span class="tg"></span>${lineHtml(cur,j,now||j===s.i+1)}<div class="ab">AD-LIB, tap the line to continue</div></div>`}).join('');
  L.querySelectorAll('.say').forEach(l=>l.onclick=()=>tapLine(cur,+l.dataset.i));
}
function renderStrip(){
  const s=st(),ln=LN(cur,s.i),act=ln.c.filter(c=>c.k!=='pause'),el=document.getElementById('strip');
  if(!ln.c.length){el.innerHTML='<div class="talk">no action \u00b7 just talk</div>';return}
  el.innerHTML=`<div class="chips">${ln.c.map(c=>chipH(c,'big',c.k!=='pause'&&act.length>1?act.indexOf(c)+1:0)).join('')}</div>`+(ln.b?`<div id="box">${esc(ln.b)}</div>`:'');
}
function renderAfter(){
  const s=st(),k=K(cur);let n=cur,j=s.i+1,pre='';
  if(j>=k){n=cur+1;j=0;pre=n<=D.steps.length?`Step ${D.steps[n-1]?D.steps[n-1].n:''}: `:''}
  const el=document.getElementById('after');
  if(n>D.steps.length){el.innerHTML='<b>AFTER THIS</b>end of the deck';return}
  const act=LN(n,j).c.filter(c=>c.k!=='pause');
  el.innerHTML='<b>AFTER THIS</b>'+esc(pre)+(act.length?chipH(act[0],'in af')+(act.length>1?` <span style="color:#8b97a7">+${act.length-1} more</span>`:''):'talk only');
}
function renderOv(){
  const c=D.steps[cur-1];
  document.getElementById('ovb').innerHTML=`<details><summary>Card notes (step ${c.n})</summary><div style="color:#b9c6d6"><p><b>Window:</b> ${esc(c.window||'')}</p><p>${esc(c.do||'')}</p>${c.type&&c.type!=='nothing'?`<div class="ty">${esc(c.type)}</div>`:''}</div></details>`+
   D.steps.map((s,i)=>`<div class="it${i+1===cur?' cur':''}" data-n="${i+1}"><span class="num">${s.n}</span><span class="t">${esc(s.title)}<br><small>${esc(s.time)} \u00b7 ${S[i+1]?cntTxt(i+1):K(i+1)+' lines'}</small></span></div>`).join('');
  document.querySelectorAll('#ovb .it').forEach(e=>e.onclick=()=>{document.getElementById('ov').classList.remove('on');if(+e.dataset.n!==cur)enterCard(+e.dataset.n,true);else paint(false)});
}
function renderScript(){
  app.innerHTML=`<header><span><span id="dot" class="dot"></span>Code ${esc(code)}</span><span id="pos"></span><span id="hc" class="upd" style="width:100%"></span></header><div id="strip"></div><div id="list"></div><div id="after"></div>`+
  `<div class="nav"><div class="row"><button class="alt" id="pl">&#9664; Prev line</button><button class="nx" id="nl">Next line &#9654;</button></div>
   <div class="row"><button class="up" id="u">&#9650;</button><button class="alt" id="d">&#9660;</button><button class="sk" id="sk">Skip</button><button class="ad" id="ad">Ad-lib</button><button class="up" id="mn">&#9776;</button></div></div>
   <div id="ov"><div class="bar"><span>Steps</span><button id="ovx">\u2715</button></div><div class="body" id="ovb"></div></div>`;
  const $=i=>document.getElementById(i);
  $('u').onclick=()=>move(-1);$('d').onclick=()=>move(1);$('nl').onclick=nextLine;$('pl').onclick=prevLine;$('sk').onclick=skipLine;$('ad').onclick=adlib;
  $('mn').onclick=()=>{renderOv();$('ov').classList.add('on');const c=document.querySelector('#ovb .it.cur');if(c)c.scrollIntoView({block:'center'})};$('ovx').onclick=()=>$('ov').classList.remove('on');
  let y0,x0;const nv=document.querySelector('.nav');nv.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;x0=e.touches[0].clientX});
  nv.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-y0,dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx))move(dy<0?1:-1);else if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))(dx<0?nextLine:prevLine)()});
}
function renderScreen(){
  app.innerHTML=`<div id="scr"><div class="cap"><span id="dot" class="dot"></span><span class="num" id="sn"></span><span class="t" id="st"></span>
  <span class="ctl"><button id="p">\u25c0</button><button id="x">\u25b6</button></span></div><div class="updbar">${D.updated?'Last updated: '+esc(D.updated):''}</div><img id="im" alt=""><span id="ib"></span></div>`;
  document.getElementById('p').onclick=()=>move(-1);document.getElementById('x').onclick=()=>move(1);
}
</script></body></html>
