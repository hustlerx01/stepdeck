<script>
const P=new URLSearchParams(location.search),code=(P.get('s')||'').replace(/\W/g,''),view=P.get('v')||(location.pathname.includes('screen')?'screen':location.pathname.includes('script')?'script':'');
const RATE=Math.max(0.1,+P.get('speed')||1);          // test hook only: ?speed=10 runs the clock 10x
const pic=(s,j)=>s.images?s.images[(s.si&&s.si[j]!=null)?s.si[j]:0]:s.image;
function badge(s,j){const b=document.getElementById('ib');if(!b)return;if(s.images){s.images.forEach(x=>{new Image().src=x+'?'+ver});b.style.display='block';b.textContent=((s.si&&s.si[j]!=null)?s.si[j]:0)+1+'/'+s.images.length}else b.style.display='none'}
const app=document.getElementById('app');let D;
const LS='sst-auto:'+code;document.body.classList.toggle('af',view==='script');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtSay=s=>esc(s).replace(/\[click now\]/gi,'<span class="ck">[click now]</span>');
if(!code||!view){
  const r=String(1000+Math.floor(Math.random()*9000));
  app.innerHTML=`<div class="home"><h1>Step Deck</h1><p style="color:var(--mut);margin-top:-8px">Full beat-by-beat script \u00b7 auto-flow</p><p>Session code</p><input id="c" inputmode="numeric" value="${code||r}">
  <a class="btn" id="a">Open Script view</a><a class="btn alt" id="b">Open Screen view</a><p style="color:var(--mut);font-size:16px">Use the same code on both devices.</p><p class="upd" id="hupd"></p></div>`;
  const go=v=>location.href=`?s=${encodeURIComponent(document.getElementById('c').value.replace(/\W/g,''))}&v=${v}`;
  fetch('steps.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{const h=document.getElementById('hupd');if(h&&j.updated)h.textContent='Last updated: '+j.updated}).catch(()=>{});
  document.getElementById('a').onclick=()=>go('script');document.getElementById('b').onclick=()=>go('screen');
}else start();

/*MATCHER-START  (pure functions, unit-tested in Node by full-build/matcher_test.js)*/
const M_STOP=new Set(('the and but for with that this these those then than from have has had are was were been being you your its not can will would could should '+
 'now just okay alright right well here there what when where which who how why also very really some any all out off over into onto about because while still even '+
 'let lets one two three got get gets going gonna um uh like yeah yes').split(' '));
function mWords(s){return String(s).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/'s\b/g,'').replace(/'/g,'').split(/[^a-z0-9]+/).filter(Boolean)}
function mContent(s){const w=mWords(s).filter(x=>x.length>=3&&!M_STOP.has(x));const nd=w.filter(x=>!/\d/.test(x));return [...new Set(nd.length>=2?nd:w)]}
function mStem(w){const r=w.replace(/(ing|ed|es|s|ly)$/,'');return r.length>=3?r:w}
function mLev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[];for(let i=0;i<=a.length;i++){d[i]=[i]}for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function mWm(a,b){if(a===b)return true;if(mStem(a)===mStem(b))return true;const m=Math.min(a.length,b.length);return (m>=5&&mLev(a,b)<=1)||(m>=8&&mLev(a,b)<=2)}
function mPrep(text){const ph=/\[say[^\]]*\]|\{[^}]*\}/.test(text);const t=text.replace(/\[[^\]]*\]|\{[^}]*\}/g,' ');return {cw:ph&&mContent(t).length<3?[]:mContent(t),ph}}
function mCover(cw,tail){let hit=0;for(const w of cw)if(tail.some(t=>mWm(w,t)))hit++;return {hit,n:cw.length}}
class Follower{
  constructor(texts){this.L=texts.map(mPrep);this.pos=0;this.base=0;this.free=false}
  setPos(p){if(p!==this.pos){this.pos=p;this.base=0;this.free=false}}
  // all = every word recognised in this recognition session so far. Returns {type:'none'|'free'|'adv'|'jump', matched, newpos, skipped, read}
  update(all){
    if(all.length<this.base)this.base=0;
    const st=Math.max(this.base,all.length-30);let tail=all.slice(st);
    tail=tail.filter(w=>w.length>=3&&!M_STOP.has(w));
    if(tail.length<2)return {type:'none'};
    const p=this.pos,N=this.L.length;if(p>=N)return {type:'none'};
    const cov=j=>{const l=this.L[j];if(!l.cw.length)return {r:0,hit:0,n:0};const c=mCover(l.cw,tail);return {r:c.hit/c.n,hit:c.hit,n:c.n}};
    const c0=cov(p);let res=null;
    if(c0.n&&c0.r>=0.6&&c0.hit>=Math.min(2,c0.n))res={type:'adv',matched:p,newpos:p+1,skipped:[],read:[]};
    else{let best=-1,br=0;
      for(let j=p+1;j<=Math.min(N-1,p+8);j++){const c=cov(j);if(c.n>=3&&c.r>=0.6&&c.hit>=3&&c.r>br+1e-9){best=j;br=c.r}}
      if(best>=0){const sk=[],rd=[];for(let q=p;q<best;q++)(this.L[q].ph||!this.L[q].cw.length?rd:sk).push(q);
        res={type:'jump',matched:best,newpos:best+1,skipped:sk,read:rd}}}
    if(res){const cw=this.L[res.matched].cw;let li=-1;for(let i=tail.length-1;i>=0&&li<0;i--)if(cw.some(w=>mWm(w,tail[i])))li=i;
      this.base=all.length-(tail.length-1-li);   // words said after the last matched one stay for the next line (approx: tail is filtered)
      if(this.base>all.length)this.base=all.length;
      this.pos=Math.min(N,res.newpos);this.free=false;return res}
    // nothing matched: is he talking about something else?
    const known=[];for(let j=Math.max(0,p-2);j<=Math.min(N-1,p+8);j++)known.push(...this.L[j].cw);
    const foreign=tail.filter(w=>!known.some(k=>mWm(k,w)));
    let mx=0;for(let j=p;j<=Math.min(N-1,p+8);j++)mx=Math.max(mx,cov(j).r);
    this.free=foreign.length>=4&&mx<0.3;return {type:this.free?'free':'none'}}
}
/*MATCHER-END*/

/* ---- clock model ----
   Timeline: G[g]={n,j,start,dur} in timeline seconds; dur = max(words/pace, typing floor) + (recorded pauses + waits + 0.35 s) * gap.
   Clock: t = C.tb (+ elapsed wall * RATE while C.run). Position is a pure function of t, so nothing needs to be sent while it runs:
   other devices only get state on change (+ a heartbeat that corrects drift beyond 1.2 s). */
const GAP0=0.35,cid=Math.random().toString(36).slice(2,8);
let G=[],total=0,pace=2.5,gap=1,rehearse=false,lang='en-IN',lastIdx=-1,lastZ='';
let C={started:false,tb:0,rt:Date.now(),run:false,sk:new Set(),ws:0,vf:false,fin:false};
const LN=(n,j)=>((D.steps[n-1].lines||[])[j])||{c:[],b:null};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const nowT=()=>C.run?clamp(C.tb+(Date.now()-C.rt)/1000*RATE,-3,total):C.tb;
const wall=()=>C.started?(Date.now()-C.ws)/1000*RATE:0;
function build(){G=[];let t=0;
  D.steps.forEach((s,n)=>s.say.forEach((x,j)=>{const L=LN(n+1,j),w=L.w!=null?L.w:x.split(/\s+/).length;
    const d=Math.max(w/pace,L.fl||0)+((L.ps||0)+(L.wt||0)+GAP0)*gap;G.push({n:n+1,j,start:t,dur:d});t+=d}));
  total=t;sf={};G.forEach((q,g)=>{if(sf[q.n]==null)sf[q.n]=g})}
let sf={};
function lineAt(t){if(t<=0)return 0;let lo=0,hi=G.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(G[m].start<=t)lo=m;else hi=m-1}return lo}
const curG=()=>lineAt(nowT());
function setT(t,run){C.tb=clamp(t,-3,total);C.rt=Date.now();if(run!==undefined)C.run=run}
const mmss=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

/* ---- sync (ntfy) ---- */
let T_URL='',hbN=0,lastRecv=0;
function dayKey(){return 'sst-auto-sent:'+new Date().toISOString().slice(0,10)}
function sentToday(){try{return +localStorage.getItem(dayKey())||0}catch(e){return 0}}
function publish(k){
  if(!window.__T)return;
  const m=JSON.stringify({c:cid,k,t:+(Math.ceil(nowT()*100)/100).toFixed(2),run:C.run?1:0,s:C.started?1:0,pc:pace,gp:gap,sk:[...C.sk].sort((a,b)=>a-b),el:+wall().toFixed(1),vf:C.vf?1:0});
  try{localStorage.setItem(dayKey(),String(sentToday()+1))}catch(e){}
  fetch(window.__T,{method:'POST',body:m}).then(r=>{if(r.status===429)syncNote('ntfy rate limit hit (free server: 250 messages/day); sync may lag')}).catch(()=>{});}
let syncMsg='';function syncNote(t){syncMsg=t;const e=document.getElementById('syncnote');if(e)e.textContent=t}
function heartbeatMs(){const n=sentToday();return n>230?0:n>150?30000:10000}   // free ntfy.sh allows 250 messages/day per IP
function hbLoop(){const ms=heartbeatMs();if(ms&&C.started&&C.run)publish('hb');setTimeout(hbLoop,ms||30000)}
function applyRemote(m,hist){
  if(!m||m.c===cid||typeof m.t!=='number')return;
  if(view==='script'&&!C.started)return;
  const dsk=(m.sk||[]).join(',')===[...C.sk].sort((a,b)=>a-b).join(',');
  if(m.pc&&(m.pc!==pace||m.gp!==gap)){pace=m.pc;gap=m.gp||1;const g=curG(),fr=G[g]?(nowT()-G[g].start)/G[g].dur:0;build();setT(G[g].start+fr*G[g].dur)}
  if(m.k==='hb'&&!hist&&C.started&&!!m.s&&C.run===!!m.run&&dsk&&Math.abs(nowT()-m.t)<1.2)return;   // already in step: leave the local clock alone
  C.started=!!m.s;C.sk=new Set(m.sk||[]);
  C.run=hist?false:!!m.run;setT(m.t);C.ws=Date.now()-(m.el||0)/RATE*1000;C.fin=false;
  lastRecv=Date.now();save();refresh(true)}
function save(){try{localStorage.setItem(LS,JSON.stringify({tb:nowT(),run:C.run,started:C.started,at:Date.now(),sk:[...C.sk],el:wall(),pace,gap,rehearse,lang}))}catch(e){}}
function restore(){try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(!o)return;pace=o.pace||pace;gap=o.gap||gap;rehearse=!!o.rehearse;lang=o.lang||lang;build();
  if(o.started){const age=(Date.now()-o.at)/1000;C.started=true;C.sk=new Set(o.sk||[]);
    if(o.run&&age<120){setT(o.tb+age*RATE,true)}else{setT(o.tb,false)}C.ws=Date.now()-((o.el||0)+(o.run&&age<120?age*RATE:0))/RATE*1000}}catch(e){}}

/* ---- commands (the only things that move the position besides the clock itself) ---- */
function seek(g,keepRun){g=clamp(g,0,G.length-1);const old=curG();
  if(g>old){for(let q=old+1;q<g;q++)C.sk.add(q)}else{[...C.sk].forEach(q=>{if(q>=g)C.sk.delete(q)})}
  C.fin=false;setT(G[g].start);cmd()}
function cmd(){save();refresh(true);publish('cmd')}
function holdToggle(){if(!C.started)return;
  if(C.vf){voiceOff('Timer mode: running from this line.',true);return}
  if(C.run){setT(nowT(),false)}else{if(C.fin){setT(0,false);C.sk=new Set();C.fin=false}C.rt=Date.now();C.run=true}cmd()}
function doStart(){C.started=true;C.sk=new Set();C.fin=false;C.ws=Date.now()+(C.vf?0:3000/RATE);
  if(C.vf){setT(0,false)}else{setT(-3,true)}wakeLock();cmd()}
function resetAll(){C.started=false;C.run=false;C.sk=new Set();C.fin=false;setT(0,false);if(C.vf)voiceOff('',false);cmd()}
function setPace(p){p=Math.round(clamp(p,1.2,4)*10)/10;if(p===pace)return;const g=curG(),fr=clamp((nowT()-G[g].start)/G[g].dur,0,1),run=C.run;pace=p;build();setT(G[g].start+fr*G[g].dur,run);cmd()}
function setGap(x){x=Math.round(clamp(x,0.25,3)*100)/100;if(x===gap)return;const g=curG(),fr=clamp((nowT()-G[g].start)/G[g].dur,0,1),run=C.run;gap=x;build();setT(G[g].start+fr*G[g].dur,run);cmd()}

/* ---- wake lock ---- */
let wl=null,wlState='not requested';
async function wakeLock(){try{if(!('wakeLock' in navigator)){wlState='not supported in this browser (keep the screen awake in phone settings)';return}
  wl=await navigator.wakeLock.request('screen');wlState='active';wl.addEventListener('release',()=>{wlState='released'})}catch(e){wlState='refused: '+(e&&e.name||'error')}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&C.started&&(!wl||wl.released))wakeLock()});

/* ---- Follow my voice ---- */
let rec=null,vfStatus='off',vfWords=[],vfFail=0,vfFailAt=0,fol=null,vfRestart=null;
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
function micDot(cls){const d=document.getElementById('mdot');if(d)d.className='dot mic '+cls;const b=document.getElementById('mic');if(b)b.className='sq mic '+(cls==='on'||cls==='wait'?'on':cls==='bad'?'bad':'')}
function showMsg(t,ms){const m=document.getElementById('msg');if(!m)return;m.textContent=t;m.classList.toggle('on',!!t);if(t&&ms)setTimeout(()=>{if(m.textContent===t)m.classList.remove('on')},ms)}
function follower(){if(!fol)fol=new Follower(D.steps.flatMap(s=>s.say));return fol}
function voiceOn(){
  if(!SRC){showMsg('Follow my voice is not supported in this browser \u2014 staying in timer mode.',9000);vfStatus='unsupported';micDot('bad');return}
  C.vf=true;vfFail=0;vfWords=[];follower().setPos(curG());follower().base=0;vfStatus='listening';document.body.classList.add('vf');
  if(C.started&&C.run)setT(nowT(),false);
  startRec();micDot('wait');cmd()}
function startRec(){
  try{rec=new SRC();rec.continuous=true;rec.interimResults=true;rec.lang=lang;rec.maxAlternatives=1;
    rec.onstart=()=>{vfWords=[];follower().base=0;micDot('on');if(vfStatus!=='free')vfStatus='listening';refresh(true)};
    rec.onresult=e=>{vfFail=0;let w=[];for(let i=0;i<e.results.length;i++)w=w.concat(mWords(e.results[i][0].transcript));vfWords=w;voiceHear(w)};
    rec.onerror=e=>{const er=e.error;
      if(er==='not-allowed'||er==='service-not-allowed'){voiceOff('Microphone permission denied \u2014 timer mode.',true);return}
      if(er==='audio-capture'){voiceOff('No microphone available \u2014 timer mode.',true);return}
      if(er==='language-not-supported'&&lang!=='en-US'){lang='en-US';return}
      if(er!=='no-speech'&&er!=='aborted'){vfFail++;vfFailAt=Date.now();micDot('wait');if(vfFail>=6)voiceOff('Voice recognition keeps failing ('+er+') \u2014 timer mode.',true)}};
    rec.onend=()=>{if(!C.vf)return;micDot('wait');clearTimeout(vfRestart);vfRestart=setTimeout(()=>{if(C.vf)startRec()},vfFail?Math.min(4000,400*vfFail):250)};
    rec.start()}catch(e){vfFail++;if(vfFail>=4)voiceOff('Could not start the microphone \u2014 timer mode.',true);else{clearTimeout(vfRestart);vfRestart=setTimeout(()=>{if(C.vf)startRec()},600)}}}
function voiceOff(msg,resume){C.vf=false;vfStatus='off';document.body.classList.remove('vf');clearTimeout(vfRestart);
  if(rec){rec.onend=null;rec.onerror=null;rec.onresult=null;try{rec.abort()}catch(e){}rec=null}
  micDot(msg&&/denied|No microphone|failing|Could not/.test(msg)?'bad':'');showMsg(msg,10000);
  if(resume&&C.started){const g=curG();setT(G[g].start,true)}cmd()}
function voiceHear(w){
  if(!C.started)return;const g=curG(),f=follower();f.setPos(g);
  const r=f.update(w);
  if(r.type==='adv'||r.type==='jump'){
    r.skipped.forEach(q=>C.sk.add(q));
    const np=Math.min(G.length-1,r.newpos);
    if(r.newpos>=G.length){C.fin=true;setT(total,false);vfStatus='listening';cmd();return}
    vfStatus='listening';setT(G[np].start,false);cmd()}
  else{const ns=r.type==='free'?'free':'listening';if(ns!==vfStatus){vfStatus=ns;refresh(true)}}}
function voiceToggle(){if(C.vf)voiceOff('Timer mode: running from this line.',true);else voiceOn()}

/* ---- rendering ---- */
function lineHtml(n,j,chips){
  const say=D.steps[n-1].say[j],ch=chips?LN(n,j).c:[];let out='',p=0;const act=ch.filter(c=>c.k!=='pause');
  ch.forEach(c=>{out+=fmtSay(say.slice(p,c.o))+chipH(c,'in',c.k!=='pause'&&act.length>1?act.indexOf(c)+1:0);p=c.o});
  const q=LN(n,j).q;return (q?`<div class="cue">${q.split(' > ').map(x=>`<span class="cp">${esc(x)}</span>`).join('<span class="ca">\u203a</span>')}</div>`:'')+out+fmtSay(say.slice(p))}
const KL={click:'\u25b6 CLICK',dbl:'\u25b6\u25b6 DOUBLE-CLICK',type:'\u2328 TYPE',key:'\u2328 KEY',move:'\u2197 MOVE',drag:'\u2193 DRAG',wait:'\u23f3 WAIT',pause:'\u23f8'};
const chipTxt=c=>c.k==='pause'?`${KL.pause} ${c.l}`:`${KL[c.k]}${c.l?' '+c.l:''}`;
const inTxt=c=>c.k==='pause'?`${KL.pause} ${c.l.replace('pause ','')}`:c.k==='key'?`${KL.key} ${c.l}`:KL[c.k].replace(' DOUBLE-CLICK',' DBL-CLICK');
const chipH=(c,cls,no)=>`<span class="chip ${c.k} ${cls}">${no?`<span class="no">${no}</span>`:''}${esc(cls==='big'||cls==='in af'?chipTxt(c):inTxt(c))}</span>`;
const PB='<i class="pb"></i>';
function renderStream(){let h='',g=0;
  D.steps.forEach((s,n)=>{h+=`<div class="dv" data-n="${n+1}"><b>Step ${s.n}</b> ${esc(s.title)}<small></small></div>`;
    s.say.forEach((x,j)=>{h+=`<div class="say" data-g="${g}">${lineHtml(n+1,j,false)}${PB}</div>`;g++})});
  const L=document.getElementById('list');L.innerHTML=h;lastZ='';lastIdx=-1;
  L.querySelectorAll('.say').forEach(el=>{el.onclick=()=>{if(C.started)seek(+el.dataset.g)}});updDividers()}
function updDividers(){document.querySelectorAll('#list .dv').forEach(d=>{d.querySelector('small').textContent=mmss(G[sf[+d.dataset.n]].start)})}
function renderStrip(g){
  const el=document.getElementById('strip'),q=G[g],ln=LN(q.n,q.j),act=ln.c.filter(c=>c.k!=='pause');
  if(nowT()<0){el.innerHTML=`<div class="talk" style="color:#ffb3b3;font-size:30px;font-weight:800">Starting in ${Math.ceil(-nowT())}\u2026</div>`;return}
  if(!ln.c.length){el.innerHTML='<div class="talk">no action \u00b7 just talk</div>';return}
  el.innerHTML=`<div class="chips">${ln.c.map(c=>chipH(c,'big',c.k!=='pause'&&act.length>1?act.indexOf(c)+1:0)).join('')}</div>`+(ln.b?`<div id="box">${esc(ln.b)}</div>`:'')}
function renderAfter(g){
  const el=document.getElementById('after');if(g+1>=G.length){el.innerHTML='<b>AFTER THIS</b>end of the narration';return}
  const q=G[g+1],pre=q.n!==G[g].n?`Step ${D.steps[q.n-1].n}: `:'',act=LN(q.n,q.j).c.filter(c=>c.k!=='pause');
  el.innerHTML='<b>AFTER THIS</b>'+esc(pre)+(act.length?chipH(act[0],'in af')+(act.length>1?` <span style="color:#8b97a7">+${act.length-1} more</span>`:''):'talk only')}
function fitNow(el,L){let fs=30;el.style.fontSize='';while(el.offsetHeight>L.clientHeight*0.8&&fs>18){fs-=2;el.style.fontSize=fs+'px'}}
let firstPaint=true,lastSk='';
function updateStream(g,smooth){
  const L=document.getElementById('list'),els=L.querySelectorAll('.say');const sk=[...C.sk].join(',');
  els.forEach((el,i)=>{const z=i===g?'now':i===g+1?'nx':(rehearse&&i>g&&i<=g+3)?'rh':i<g?(C.sk.has(i)?'skip':'read'):'fut';
    if(el._z!==z){el.className='say '+z;el.style.fontSize='';const ch=z==='now'||z==='nx'||z==='rh';
      if(ch!==!!el._c){el.innerHTML=lineHtml(G[i].n,G[i].j,ch)+PB;el._c=ch}el._z=z}});
  const now=els[g];if(now){fitNow(now,L);L.scrollTo({top:now.offsetTop-(L.clientHeight-now.offsetHeight)/2,behavior:smooth&&!firstPaint?'smooth':'auto'})}
  firstPaint=false}
function stateBar(){
  const t=nowT(),el=document.getElementById('state');let cls,txt,r='';
  if(!C.started){cls='hold';txt='not started'}
  else if(C.fin){cls='end';txt='\u25a0 THE END'}
  else if(C.vf){const o=vfStatus==='free';cls=o?'free':'voice';txt=o?'\ud83c\udf99 listening, free talk (holding)':'\ud83c\udf99 VOICE FOLLOW \u00b7 listening';r=o?'say the line to continue':''}
  else if(t<0){cls='rdy';txt='GET READY'}
  else if(C.run){cls='run';txt='\u25b6 RUNNING';r=RATE!==1?RATE+'\u00d7 test clock':''}
  else{cls='hold';txt='\u23f8 HOLD \u00b7 clock frozen';r='ad-lib freely'}
  el.className=cls;el.innerHTML=`<span>${txt}</span><span style="font-weight:600;font-size:13px">${r}</span>`;
  document.body.classList.toggle('hd',cls==='hold');
  const hb=document.getElementById('hold');
  if(hb){if(C.vf){hb.className='hold vo';hb.innerHTML='\ud83c\udf99 Voice on<small>tap = back to timer</small>'}
    else if(C.run){hb.className='hold';hb.innerHTML='\u23f8 HOLD<small>freeze the clock</small>'}else{hb.className='hold res';hb.innerHTML='\u25b6 RESUME<small>clock continues</small>'}}}
function header(g,t){
  const q=G[g],s=D.steps[q.n-1];
  document.getElementById('pos').textContent=`Step ${s.n} (${q.n}/${D.steps.length})`;
  const w=wall(),diff=w-Math.max(0,t);let b='on plan',bc='';
  if(C.started&&w>3){if(diff>=3){b='behind '+mmss(diff);bc='bh'}else if(diff<=-3){b='ahead '+mmss(-diff);bc='ah'}}
  document.getElementById('tm').textContent=`${mmss(w)} / ${mmss(total)}`;
  const bd=document.getElementById('badge');bd.textContent=C.started?b:'';bd.className=bc;
  document.getElementById('ln').textContent=`line ${g+1}/${G.length}`;
  document.getElementById('bf').style.width=(clamp(t,0,total)/total*100)+'%';

function refresh(force){
  if(!G.length)return;

  if(C.vf&&fol)fol.setPos(g);
  const z=[g,C.started,C.run,C.vf,vfStatus,[...C.sk].join(','),rehearse,pace,gap,t<0?Math.ceil(-t):0,C.fin].join('|');
  if(force||z!==lastZ){lastZ=z;updateStream(g,true);renderStrip(g);renderAfter(g);stateBar();updDividers();
    document.getElementById('go').classList.toggle('on',!C.started)}
  header(g,t);
  const el=document.querySelector('#list .say.now');if(el)el.style.setProperty('--p',clamp((t-G[g].start)/G[g].dur,0,1));

function gosum(){const e=document.getElementById('gosum');if(e)e.innerHTML=`${D.steps.length} steps \u00b7 ${G.length} lines \u00b7 planned ${mmss(total)} at ${pace.toFixed(1)} w/s`}
function screenPaint(){
  const t=nowT(),g=lineAt(t),q=G[g],s=D.steps[q.n-1];
  document.getElementById('sn').textContent=s.n;document.getElementById('st').textContent=s.title+(s.do?' \u2014 '+s.do:'');
  const pc=pic(s,q.j),im=document.getElementById('im'),src=pc?pc+'?'+ver:'';if(im.getAttribute('src')!==src)im.src=src;badge(s,q.j);
  const nx=D.steps[q.n];if(nx&&nx.image)new Image().src=nx.image+'?'+ver;
  document.getElementById('sl').textContent=`line ${g+1}/${G.length} \u00b7 ${!C.started?'not started':C.fin?'the end':t<0?'get ready':C.run?'running':'on hold'}`;
  document.getElementById('stm').textContent=`${mmss(Math.max(0,t))} / ${mmss(total)}`}
function renderScreen(){
  app.innerHTML=`<div id="scr"><div class="cap"><span id="dot" class="dot"></span><span class="num" id="sn"></span><span class="t" id="st"></span>
  <span class="ctl"><button id="p">\u25c0</button><button id="x">\u25b6</button></span></div><div class="updbar"><span id="sl"></span><span id="stm"></span></div><img id="im" alt=""><span id="ib"></span></div>`;
  const mv=d=>{const q=G[curG()],n=clamp(q.n+d,1,D.steps.length);C.sk=new Set();setT(G[sf[n]].start);cmd()};
  document.getElementById('p').onclick=()=>mv(-1);document.getElementById('x').onclick=()=>mv(1)}
let ver='';
async function start(){
  D=await (await fetch('steps.json',{cache:'no-store'})).json();
  try{ver=(await (await fetch('images/.v',{cache:'no-store'})).text()).trim()}catch(e){}
  build();restore();
  view==='script'?renderScript():renderScreen();refresh(true);
  const T='https://ntfy.sh/stepdeck-sst-auto-k7q2-'+code;window.__T=T;
  try{const t=await (await fetch(T+'/json?poll=1&since=12h',{cache:'no-store'})).text();const ls=t.trim().split('\n').filter(Boolean).map(JSON.parse).filter(m=>m.event==='message');
    for(let i=ls.length-1;i>=0;i--){let m;try{m=JSON.parse(ls[i].message)}catch(e){continue}if(m&&m.c!==cid&&typeof m.t==='number'){if(view==='screen'){const age=Date.now()/1000-ls[i].time;applyRemote(m,age>30)}break}}}catch(e){}
  const es=new EventSource(T+'/sse');
  es.onmessage=e=>{const m=JSON.parse(e.data);if(m.event==='message'){try{applyRemote(JSON.parse(m.message),false)}catch(x){}}};es.onopen=()=>dot(1);es.onerror=()=>dot(0);
  setInterval(tick,100);setInterval(save,5000);hbLoop();
  window.__sst={C,get G(){return G},nowT,curG,seek,holdToggle,doStart,setPace,get pace(){return pace},get gap(){return gap},get total(){return total},Follower,voiceHear,get fol(){return fol}};
}
