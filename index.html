<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000">
<title>jump01 overnight SSH triage</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#top{display:flex;align-items:center;gap:16px;padding:10px 18px;background:#111;font-size:20px}
#clk{font:700 30px ui-monospace,Menlo,monospace}#plan{color:#9aa;font:20px ui-monospace,Menlo,monospace}
#drift{font:700 22px ui-monospace,Menlo,monospace;padding:2px 10px;border-radius:8px}
.ok{background:#14532d}.late{background:#7f1d1d}.early{background:#1e3a8a}
#pos{margin-left:auto;color:#9aa}button{font-size:20px;padding:8px 18px;border-radius:10px;border:0;background:#333;color:#fff}
#main{display:flex;height:calc(100% - 62px);padding:14px 22px;gap:22px}
#txt{flex:1;display:flex;flex-direction:column;min-width:0}
#ttl{color:#8ab4ff;font-size:20px;font-weight:600}#do{color:#ffd166;font-size:21px;margin:6px 0 12px;line-height:1.3}
#say{font-size:46px;line-height:1.28;font-weight:600;flex:1;overflow:auto}
#next{color:#888;font-size:22px;border-top:1px solid #333;padding-top:8px;max-height:5.5em;overflow:hidden}
#side{width:260px;display:flex;flex-direction:column;gap:8px}
#th{width:100%;border-radius:8px;border:1px solid #444}#mk{color:#ff7a7a;font-size:13px;overflow:auto;white-space:pre-line}
#big{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9}#big img{max-width:98%;max-height:98%}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:8}
#start button{font-size:48px;padding:30px 80px;background:#16a34a;border-radius:20px}
</style></head><body>
<div id="start"><button id="go">▶ Start</button></div>
<div id="top"><span id="clk">0:00</span><span id="plan">plan 0:00</span><span id="drift" class="ok">±0s</span><button id="pp">Pause</button><button id="rs">Reset</button><span id="pos"></span></div>
<div id="main"><div id="txt"><div id="ttl"></div><div id="do"></div><div id="say"></div><div id="next"></div></div>
<div id="side"><img id="th" alt=""><div id="mk"></div></div></div>
<div id="big"><img id="bi"></div>
<script>
let S=[],T=[],t0=0,off=0,paused=false,pauseAt=0,cur=-1,lock=null;
const $=id=>document.getElementById(id),sec=s=>{const[m,x]=String(s).split(':').map(Number);return m*60+(x||0)};
const fmt=v=>{v=Math.round(v);const n=v<0;v=Math.abs(v);return(n?'-':'')+Math.floor(v/60)+':'+String(v%60).padStart(2,'0')};
const real=()=>((paused?pauseAt:performance.now())-t0)/1000, now=()=>real()+off;
function idxAt(t){let i=0;for(let k=0;k<T.length;k++)if(T[k]<=t)i=k;return i}
function render(i){cur=i;const s=S[i],n=S[i+1];
 $('ttl').textContent=s.title;$('do').textContent=(s.window?'WHERE: '+s.window+'  ·  ':'')+(s.do||'')+(s.type&&s.type!=='nothing'?'  ·  TYPE: '+s.type:'');
 $('say').textContent=(s.say||[]).join(' ');$('next').textContent=n?'next: '+(n.say||[]).join(' '):'next: (end)';
 $('pos').textContent=`${s.beat}  ·  ${i+1}/${S.length}`;const th=$('th');if(s.image){th.src=s.image;th.style.display=''}else th.style.display='none';
 $('mk').textContent=(s.missing||[]).join('\n');$('say').scrollTop=0}
function tick(){const i=idxAt(now());if(i!==cur)render(i);
 $('clk').textContent=fmt(real());$('plan').textContent='plan '+fmt(T[cur]);
 const d=Math.round(real()-T[cur]),dd=$('drift');dd.textContent=(d>=0?'+':'')+d+'s '+(d>0?'behind':d<0?'ahead':'');
 dd.className=Math.abs(d)<=5?'ok':d>0?'late':'early';requestAnimationFrame(tick)}
function jump(i){i=Math.max(0,Math.min(S.length-1,i));off=T[i]-real()+0.001;render(i)}
async function wake(){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&t0)wake()});
$('go').onclick=()=>{if(!S.length)return;t0=performance.now();off=0;$('start').style.display='none';wake();render(0);requestAnimationFrame(tick)};
$('pp').onclick=e=>{e.stopPropagation();if(paused){t0+=performance.now()-pauseAt;paused=false;$('pp').textContent='Pause'}else{pauseAt=performance.now();paused=true;$('pp').textContent='Resume'}};
$('rs').onclick=e=>{e.stopPropagation();if(confirm('Reset clock to 0:00?')){paused=false;$('pp').textContent='Pause';t0=performance.now();off=0;render(0)}};
$('th').onclick=e=>{e.stopPropagation();$('bi').src=S[cur].image;$('big').style.display='flex'};$('big').onclick=e=>{e.stopPropagation();$('big').style.display='none'};
$('main').addEventListener('click',e=>{if(!t0)return;jump(cur+(e.clientX>innerWidth/2?1:-1))});
addEventListener('keydown',e=>{if(!t0)return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();jump(cur+1)}else if(e.key==='ArrowLeft'){e.preventDefault();jump(cur-1)}});
fetch('steps.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{S=d.steps;T=S.map(s=>sec(s.time));document.title=d.title});
</script></body></html>
